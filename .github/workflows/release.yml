name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Create zip archive
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          zip -r "qullamaggie-scanner-${VERSION}.zip" \
            ibkr_tws/ ui/ tests/ website/ \
            settings.json requirements.txt \
            README.md LICENSE \
            run_decision_station.sh setup_app.sh \
            pyproject.toml \
            -x "*.pyc" "__pycache__/*" ".pytest_cache/*"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
            qullamaggie-scanner-*.zip
