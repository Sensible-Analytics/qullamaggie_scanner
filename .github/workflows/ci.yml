name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint with flake8 (non-blocking)
        continue-on-error: true
        run: |
          flake8 ibkr_tws/ ui/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 ibkr_tws/ ui/ --count --exit-zero --max-complexity=15 --max-line-length=150 --statistics

      - name: Run tests
        run: |
          export PYTHONPATH=$PYTHONPATH:.
          pytest tests/ -k "not playwright" --tb=short -q
