# Dependabot configuration for mixed Python/TypeScript projects
# Template for: qullamaggie_scanner (Python + HTML/Frontend)

version: 2

updates:
  # pip packages - Weekly check
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "Australia/Sydney"
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    labels:
      - "dependencies"
      - "python"
    reviewers:
      - "Sensible-Analytics/engineering"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      production:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  # npm packages (if applicable for frontend)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Australia/Sydney"
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    labels:
      - "dependencies"
      - "npm"
      - "frontend"
    reviewers:
      - "Sensible-Analytics/engineering"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      frontend:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions - Weekly check
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Australia/Sydney"
    open-pull-requests-limit: 20
    labels:
      - "dependencies"
      - "github-actions"
    reviewers:
      - "Sensible-Analytics/engineering"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions:
        patterns:
          - "*"
    rebase-strategy: auto
